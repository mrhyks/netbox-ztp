{% extends 'base.html' %}
{% block content %}
  <h2>{{ object.device.name }}</h2>
  <dl class="dl-horizontal">
    <dt>Device</dt><dd>{{ object.device }}</dd>
    <dt>Enabled</dt><dd>{{ object.enabled|yesno:"Yes,No" }}</dd>
    <dt>Last scan</dt><dd>{{ object.last_scan|default:"Never" }}</dd>
    <dt>Scan interval</dt><dd>{{ object.scan_interval }} seconds</dd>
  </dl>
{% endblock %}
