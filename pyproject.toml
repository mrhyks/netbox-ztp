[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ztp"
authors = [{name = "Matej Hyks", email = "hyks.matej@gmail.com"}]
maintainers = [{name = "Matej Hyks", email = "hyks.matej@gmail.com"}]
version = "0.1.0"
description = "Zero Touch Provisioning plugin for NetBox"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["netbox-plugin", ]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
  "napalm>=4.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_ztp*"]

[tool.setuptools.package-data]
netbox_ztp = ["templates/netbox_ztp/*.html"]

[tool.black]
skip-string-normalization = 1
fast = 1
check = 0
diff = 0

[tool.pyright]
reportCallIssue = false