{% extends 'base.html' %}
{% block content %}
  <h2>{{ title }}</h2>
  <div class="row">
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h5>Source devices</h5>
          <p class="h3">{{ source_count }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h5>Onboarded</h5>
          <p class="h3">{{ onboarded_count }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h5>Log entries</h5>
          <p class="h3">{{ log_count }}</p>
        </div>
      </div>
    </div>
  </div>
  <p>Use this plugin to scan source devices for ARP neighbors, validate new devices over SSH, and onboard them into NetBox.</p>
{% endblock %}
